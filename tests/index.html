<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Running tests…</title>
    <style>
      :root {
        --ink: #17241f;
        --muted: #5b6b64;
        --line: #dfe6e2;
        --pass: #1d7a4f;
        --pass-bg: #e6f4ec;
        --fail: #b3261e;
        --fail-bg: #fdecea;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
        background: #f5f7f6;
      }
      body { margin: 0; }
      main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
      .sub code { background: #e8eeeb; padding: 1px 6px; border-radius: 4px; }
      .banner { border-radius: 12px; padding: 18px 22px; font-size: 22px; font-weight: 700; margin-bottom: 20px; }
      .banner.pass { background: var(--pass-bg); color: var(--pass); }
      .banner.fail { background: var(--fail-bg); color: var(--fail); }
      .banner small { display: block; font-size: 13px; font-weight: 500; opacity: 0.85; margin-top: 4px; }
      section { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
      section h2 { font-size: 14px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fbfcfb; }
      ul { list-style: none; margin: 0; padding: 6px 0; }
      li { padding: 6px 16px; font-size: 14px; }
      li .mark { display: inline-block; width: 1.4em; font-weight: 700; }
      li.pass .mark { color: var(--pass); }
      li.fail .mark { color: var(--fail); }
      li.fail { background: var(--fail-bg); }
      pre { margin: 6px 0 2px 1.4em; white-space: pre-wrap; font-size: 12.5px; color: var(--fail); }
      pre.logs { color: var(--muted); }
    </style>
    <script>
      // Report scripts that fail to load or throw, so a broken file never looks like a green run.
      window.loadErrors = [];
      window.addEventListener(
        'error',
        (event) => {
          const target = event.target;
          const file = target && target.src ? target.src.split('/').slice(-2).join('/') : event.filename || '';
          window.loadErrors.push(target && target.src ? `Could not load ${file}` : `${event.message} (${file}:${event.lineno})`);
        },
        true
      );
    </script>
  </head>
  <body>
    <main>
      <h1>Woodgrove Transfers · tests</h1>
      <p class="sub">Browser runner. In a terminal, run <code>node tests/run.js</code> for the same tests.</p>
      <div id="report">Running tests…</div>
    </main>

    <!-- Code under test: data/ first, then src/ (a file after the files it depends on) -->
    <script src="../data/accounts.js"></script>
    <script src="../src/config.js"></script>
    <script src="../src/iban.js"></script>
    <script src="../src/money.js"></script>
    <script src="../src/payee.js"></script>
    <script src="../src/transfer.js"></script>
    <script src="../src/confluence.js"></script>

    <!-- Test framework -->
    <script src="harness.js"></script>

    <!-- Test files -->
    <script src="iban.test.js"></script>
    <script src="money.test.js"></script>
    <script src="payee.test.js"></script>
    <script src="server.test.js"></script>
    <script src="transfer.test.js"></script>

    <!-- Report -->
    <script>
      (function () {
        const report = document.getElementById('report');
        const el = (tag, className, text) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        };

        function render(results) {
          const failed = results.filter((r) => !r.passed).length + window.loadErrors.length;
          const passed = results.length - results.filter((r) => !r.passed).length;
          const ok = failed === 0 && results.length > 0;

          document.title = ok ? `✓ ${passed} passed` : `✗ ${failed} failed`;
          report.textContent = '';

          const banner = el('div', `banner ${ok ? 'pass' : 'fail'}`, ok ? `✓ ${passed} passed` : `✗ ${failed} failed`);
          banner.appendChild(el('small', '', `${results.length} tests · ${new Date().toLocaleTimeString()}`));
          report.appendChild(banner);

          if (window.loadErrors.length) {
            const section = el('section');
            section.appendChild(el('h2', '', 'Scripts that failed to load'));
            const list = el('ul');
            window.loadErrors.forEach((message) => {
              const item = el('li', 'fail');
              item.appendChild(el('span', 'mark', '✗'));
              item.appendChild(document.createTextNode(message));
              list.appendChild(item);
            });
            section.appendChild(list);
            report.appendChild(section);
          }

          const suites = new Map();
          results.forEach((r) => suites.set(r.suite, [...(suites.get(r.suite) || []), r]));
          suites.forEach((items, suite) => {
            const section = el('section');
            section.appendChild(el('h2', '', suite));
            const list = el('ul');
            items.forEach((r) => {
              const item = el('li', r.passed ? 'pass' : 'fail');
              item.appendChild(el('span', 'mark', r.passed ? '✓' : '✗'));
              item.appendChild(document.createTextNode(r.name));
              if (!r.passed) {
                item.appendChild(el('pre', '', r.error.message));
                if (r.logs.length) item.appendChild(el('pre', 'logs', `console.log:\n${r.logs.join('\n')}`));
              }
              list.appendChild(item);
            });
            section.appendChild(list);
            report.appendChild(section);
          });
        }

        if (!window.WoodgroveTests) {
          window.loadErrors.push('tests/harness.js did not load');
          render([]);
        } else {
          window.WoodgroveTests.run().then(render);
        }
      })();
    </script>
  </body>
</html>
